name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger so a release can be (re)created from the Actions tab for a
  # chosen tag even if the tag-push event did not enqueue a run (a common
  # quirk on forks where Actions was enabled after the tag was pushed).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.2). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.ref }}

      - name: Generate Release Notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.ref }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "${{ steps.changelog.outputs.content }}"
          else
            gh release create "$TAG" --title "$TAG" --notes "${{ steps.changelog.outputs.content }}"
          fi
